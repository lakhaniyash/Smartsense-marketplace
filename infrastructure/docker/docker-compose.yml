services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@db:5432/smartsense_marketplace
      # No GRAPHQL_INTROSPECTION override — NODE_ENV=production above already
      # makes configuration.ts default it off; an explicit 'true' here would
      # unconditionally re-enable it and defeat that fail-closed default.
      GRAPHQL_DEBUG: 'false'
      GRAPHQL_PLAYGROUND: 'false'
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: smartsense-marketplace
      KEYCLOAK_API_CLIENT_ID: smartsense-api
      KEYCLOAK_API_CLIENT_SECRET: smartsense-api-dev-secret-change-me
      KEYCLOAK_ADMIN_CLIENT_ID: smartsense-api-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: smartsense-api-admin-dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # Static SPA served by nginx (SM-346). Build context is the monorepo root
  # (npm workspaces); VITE_* args below are the browser-facing origins for the
  # local full stack — a production build passes its own origins (one image
  # per environment, see apps/web/Dockerfile). Reaching Keycloak login through
  # this origin also requires the realm's client redirect URIs to include it.
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GRAPHQL_URL: http://localhost:3000/graphql
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: smartsense-marketplace
        VITE_KEYCLOAK_CLIENT_ID: smartsense-web
        VITE_AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:8081/login
    ports:
      - '8081:80'
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartsense_marketplace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ../keycloak/realm-export:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_db_data:
