name: CD

# Deployment is triggered by promotion — a semver tag — not by every merge to
# development (docs/deployment.md § CI/CD Target Pipeline). workflow_dispatch
# allows a manual redeploy of an existing tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; the repo is lakhaniyash/Smartsense-marketplace.
  IMAGE_API: ghcr.io/lakhaniyash/smartsense-marketplace/api
  IMAGE_WEB: ghcr.io/lakhaniyash/smartsense-marketplace/web

jobs:
  # SM-299 — build once, tag with the release version + commit SHA, push to GHCR.
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: meta
        # Tag build → the tag (e.g. v1.0.0); manual dispatch → short SHA.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # VITE_* are baked at build time (Vite). Production origins come from
          # repo/environment variables — set them in Settings → Variables, or
          # the image serves against localhost. See apps/web/Dockerfile.
          build-args: |
            VITE_GRAPHQL_URL=${{ vars.VITE_GRAPHQL_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Local Production Simulation — replaces the former VPS/SSH deploy stub.
  # This project deliberately runs no paid cloud service and no VPS: instead
  # of deploying to a real host, this job pulls the exact images
  # build-and-push just published to GHCR and runs the full
  # migrate-then-deploy-then-smoke-test sequence entirely on the GitHub-hosted
  # runner via Docker Compose (scripts/local-prod-sim.sh). This is a stronger
  # proof than rebuilding fresh here would be — it also validates the GHCR
  # round-trip (auth, manifest correctness) a real promotion would depend on.
  # No SSH, no VPS_HOST/VPS_USER/VPS_SSH_KEY secrets, no external host —
  # everything this job touches is torn down when the job ends.
  local-prod-sim:
    name: Local Production Simulation
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run local production simulation
        run: scripts/local-prod-sim.sh --pull "$VERSION"
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          IMAGE_API_REPO: ${{ env.IMAGE_API }}
          IMAGE_WEB_REPO: ${{ env.IMAGE_WEB }}
