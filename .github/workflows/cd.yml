name: CD

# Deployment is triggered by promotion — a semver tag — not by every merge to
# development (docs/deployment.md § CI/CD Target Pipeline). workflow_dispatch
# allows a manual redeploy of an existing tag.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to GHCR

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; the repo is lakhaniyash/Smartsense-marketplace.
  IMAGE_API: ghcr.io/lakhaniyash/smartsense-marketplace/api
  IMAGE_WEB: ghcr.io/lakhaniyash/smartsense-marketplace/web

jobs:
  # SM-299 — build once, tag with the release version + commit SHA, push to GHCR.
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: meta
        # Tag build → the tag (e.g. v1.0.0); manual dispatch → short SHA.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # VITE_* are baked at build time (Vite). Production origins come from
          # repo/environment variables — set them in Settings → Variables, or
          # the image serves against localhost. See apps/web/Dockerfile.
          build-args: |
            VITE_GRAPHQL_URL=${{ vars.VITE_GRAPHQL_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SM-300 / SM-301 — migrate then deploy on the VPS, then smoke-test /health.
  # STUB: requires VPS access secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) and a
  # deploy directory on the host holding the compose file + a runtime .env +
  # the database/ folder (schema + migrations). Documented in
  # docs/deployment.md § CI/CD; not exercised in CI (no VPS is provisioned).
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VERSION
          script: |
            set -euo pipefail
            cd /opt/smartsense           # deploy dir: docker-compose.yml + .env + database/

            # Pull the freshly built images (SM-299 artifacts).
            docker compose pull

            # SM-300 — migrate BEFORE starting the new app containers. Run via a
            # throwaway prisma container on the app network, so the runtime image
            # stays lean and migrations never run from inside a serving container.
            docker run --rm --network smartsense_default \
              --env-file .env \
              -v "$PWD/database:/database" \
              node:22-alpine \
              sh -lc "npx --yes prisma@6 migrate deploy --schema /database/prisma/schema.prisma"

            # Start the new versions.
            docker compose up -d

            # SM-301 — post-deploy smoke: fail the deploy if /health never goes
            # healthy (which includes the DB dependency check, SM-267).
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/health >/dev/null; then
                echo "post-deploy health check passed"; exit 0
              fi
              echo "waiting for /health ($i)…"; sleep 4
            done
            echo "post-deploy health check FAILED" >&2
            exit 1
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
