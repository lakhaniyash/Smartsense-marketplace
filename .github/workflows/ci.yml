name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Type Check · Test · Build
    runs-on: ubuntu-latest

    # Real Postgres for apps/api's Jest e2e suite (docs/testing.md § Test
    # Database Strategy — never SQLite/in-memory, same engine as prod).
    # Keycloak itself is never needed here: the e2e suite replaces it with a
    # local, throwaway JWKS HTTP server per test run (see
    # apps/api/test/auth.e2e-spec.ts) — only KEYCLOAK_URL/REALM/CLIENT_ID
    # need to resolve to *something*, since the app never actually calls out
    # to them once the JWKS URI is overridden.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartsense_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/smartsense_marketplace
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: smartsense-marketplace
      KEYCLOAK_API_CLIENT_ID: smartsense-api
      KEYCLOAK_API_CLIENT_SECRET: smartsense-api-dev-secret-change-me

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@smartsense/api

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (apps/api Jest, apps/web Vitest)
        run: npm run test

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace=@smartsense/api

      - name: Seed reference data
        # The e2e suite maps JWT realm roles onto real Role/Permission rows
        # (docs/database-schema.md § Seed Data) — without this, every
        # permission check in the suite below fails closed on a fresh DB.
        run: npm run prisma:seed --workspace=@smartsense/api

      - name: Backend integration tests (real Postgres + mocked JWKS)
        # Deliberately `--workspace=@smartsense/api`, not the root
        # `npm run test:e2e` (which would also try apps/web's Playwright
        # suite — that needs a live Keycloak + API + frontend stack this
        # job doesn't stand up yet). Scoped here until that's wired in.
        run: npm run test:e2e --workspace=@smartsense/api

      - name: Build
        run: npm run build

  # Playwright E2E against the real full stack (api + web + db + keycloak),
  # orchestrated with Docker Compose rather than GitHub Actions `services:` —
  # `services:` containers start in parallel with no equivalent to Compose's
  # `depends_on: condition: service_healthy` chain, which is exactly the
  # ordering the stack needs (keycloak waits on keycloak-db; api waits on
  # both db and keycloak). `needs: ci` fail-fasts: never pay for booting four
  # containers and two image builds if lint/unit/integration already failed.
  playwright:
    name: Playwright E2E
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: docker/setup-buildx-action@v3

      # Pre-build with the GHA layer cache (same mechanism cd.yml already
      # uses) so `docker compose up` below hits cache instead of a cold build.
      - name: Build API image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: smartsense-marketplace-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: smartsense-marketplace-web:local
          build-args: |
            VITE_GRAPHQL_URL=http://localhost:3000/graphql
            VITE_KEYCLOAK_URL=http://localhost:8080
            VITE_KEYCLOAK_REALM=smartsense-marketplace
            VITE_KEYCLOAK_CLIENT_ID=smartsense-web
            VITE_AUTH_POST_LOGOUT_REDIRECT_URI=http://localhost:8081/login
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Boot full stack (db, keycloak-db, keycloak, api, web)
        run: docker compose -p smartsense -f infrastructure/docker/docker-compose.yml up -d --wait --wait-timeout 180

      - name: Wait for API, web, and the imported Keycloak realm to be ready
        # The keycloak container healthcheck only proves the HTTP port is
        # listening, not that `--import-realm` finished writing the
        # smartsense-marketplace realm — those are different milestones with
        # a real gap between them. Polling the realm's own well-known
        # endpoint (404s until the realm exists) is the precise signal.
        run: |
          timeout 60 bash -c 'until curl -fsS http://localhost:3000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -fsS http://localhost:8081/ >/dev/null; do sleep 2; done'
          timeout 30 bash -c 'until curl -fsS http://localhost:8080/realms/smartsense-marketplace/.well-known/openid-configuration | grep -q issuer; do sleep 2; done'

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy --workspace=@smartsense/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/smartsense_marketplace

      - name: Seed reference data + test users
        run: npm run prisma:seed --workspace=@smartsense/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/smartsense_marketplace

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: apps/web

      - name: Run Playwright E2E
        # Invoked directly, not via `npm run test:e2e --workspace=...` /
        # Turbo — the app under test is the Compose-served build above, not
        # a build Turbo would otherwise try to (re)produce.
        run: npx playwright test
        working-directory: apps/web
        env:
          PW_BASE_URL: http://localhost:8081
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -p smartsense -f infrastructure/docker/docker-compose.yml logs --no-color > compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down stack
        if: always()
        run: docker compose -p smartsense -f infrastructure/docker/docker-compose.yml down -v
