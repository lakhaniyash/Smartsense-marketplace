# Security response headers are declared inside each location block, not at
# server level: nginx's add_header inheritance is all-or-nothing per level, so
# a location that sets its own add_header (Cache-Control below) would otherwise
# drop server-level headers entirely. The CSP closes the remaining half of
# SM-169 (the API's own headers come from helmet, SM-269). connect-src /
# frame-src list the local-stack API + Keycloak origins; a production image is
# built with its own origins (env-specific by the same one-image-per-env
# tradeoff as the VITE_* build args — see the Dockerfile).
#
# script-src's two hashes allowlist exactly the two inline scripts this app
# serves — index.html's pre-paint dark-mode class toggle, and
# public/silent-check-sso.html's postMessage relay (Keycloak's silent-SSO
# iframe, served from this same origin/location block) — instead of
# 'unsafe-inline', which would allow any inline script, not just these two
# reviewed ones. Recompute a hash (`sha256-<base64 of the SHA-256 of the
# script's exact text, no tags>`) if either script's content ever changes —
# a stale hash fails closed (blocks the script) rather than open.
map "" $csp {
  default "default-src 'self'; script-src 'self' 'sha256-xpj+xHOcjAhqmH955SWGNBKbCHyYrux1URGaun9jCwU=' 'sha256-mhX4II4vUWTvksHDsl91lXPdcAHK+Q0b8//NtPJfiL0='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://localhost:8080; frame-src 'self' http://localhost:8080; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed, immutable build assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $csp always;
  }

  # SPA history fallback: every non-file route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $csp always;
  }
}
