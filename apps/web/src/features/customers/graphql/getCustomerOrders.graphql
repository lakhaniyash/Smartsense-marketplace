query GetCustomerOrders($customerId: ID!, $first: Int, $after: String) {
  orders(first: $first, after: $after, filter: { customerId: $customerId }) {
    edges {
      cursor
      node {
        id
        orderNumber
        status
        total
        placedAt
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
